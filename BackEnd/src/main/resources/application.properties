# @carrera       Pedagogía de las Ciencias Experimentales - Informática
# @asignatura    Programación Web
# @docente       Johnny H. Sánchez L.
# @proyecto      Sistema de Gestión de Prácticas (SGP)
# @estudiante    Cristhian Hipólito Girón Chamba (cristhian.giron@unl.edu.ec)
# @file          application.properties
# @fecha         2026-11-09 11:08:16
# @nota          Define la configuración de application.properties utilizada por el backend y sus herramientas.

spring.profiles.default=dev
app.network.host=${SGP_HOST:localhost}
app.network.frontend-port=${FRONTEND_PORT:3000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sgp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cristhian}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=${SPRING_HIBERNATE_BATCH_FETCH_SIZE:50}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=60MB
debug=${SPRING_DEBUG:false}
logging.level.root=${SPRING_LOG_LEVEL:info}
logging.level.org.springframework=${SPRING_FRAMEWORK_LOG_LEVEL:info}
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=${SPRING_CONDITION_REPORT_LOG_LEVEL:off}
logging.level.org.hibernate.SQL=${SPRING_HIBERNATE_SQL_LOG_LEVEL:off}

# JWT
jwt.secret=${JWT_SECRET:dev-default-jwt-secret-please-change-this-32chars!}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Recuperación temporal de contraseña de admin
app.admin-recovery.enabled=${APP_ADMIN_RECOVERY_ENABLED:true}
app.admin-recovery.secret=${APP_ADMIN_RECOVERY_SECRET:tu-secreto}

# Default deployment context; catalogs remain open to additional institutions.
app.institutional.seed-enabled=${SGP_SEED_INSTITUTIONAL_DEFAULTS:true}
app.institutional.university-code=${SGP_UNIVERSITY_CODE:UNL}
app.institutional.university-name=${SGP_UNIVERSITY_NAME:Universidad Nacional de Loja}
app.institutional.faculty-code=${SGP_FACULTY_CODE:UNL-FEAC}
# Unicode escapes keep .properties defaults independent of the property loader's encoding.
app.institutional.faculty-name=${SGP_FACULTY_NAME:Facultad de la Educaci\u00f3n, el Arte y la Comunicaci\u00f3n}
app.institutional.career-code=${SGP_CAREER_CODE:UNL-PCEI}
app.institutional.career-name=${SGP_CAREER_NAME:Pedagog\u00eda de las Ciencias Experimentales - Inform\u00e1tica}

# Preserve Spanish characters in request/response text and SQL scripts.
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
spring.sql.init.encoding=UTF-8
